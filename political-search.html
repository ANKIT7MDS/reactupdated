<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventLens AI — Karyakarta Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Cinzel', 'serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          colors: {
            navy: { 950: '#03070F', 900: '#060D1F', 800: '#0B1530', 700: '#112044', 600: '#1A3060' },
            gold: { 300: '#F5D78A', 400: '#EFC24A', 500: '#D4A017', 600: '#B8880F', 700: '#8B6210' },
            jade: { 400: '#3ECFB2', 500: '#2AB89C' },
          },
          animation: {
            scandown: 'scandown 2.5s linear infinite',
            pulseRing: 'pulseRing 2s ease infinite',
            fadein: 'fadein 0.5s ease forwards',
          },
          keyframes: {
            scandown: { '0%': { top: '0%', opacity: 0 }, '10%': { opacity: 1 }, '90%': { opacity: 1 }, '100%': { top: '100%', opacity: 0 } },
            pulseRing: { '0%,100%': { boxShadow: '0 0 0 0 rgba(212,160,23,0.4)' }, '50%': { boxShadow: '0 0 0 12px rgba(212,160,23,0)' } },
            fadein: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #03070F;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,160,23,0.12) 0%, transparent 60%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23D4A017' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      background-attachment: fixed;
      color: #D1D9E6;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }

    .glass {
      background: linear-gradient(135deg, rgba(17,32,68,0.65) 0%, rgba(6,13,31,0.85) 100%);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(212,160,23,0.12);
      box-shadow: 0 8px 48px rgba(0,0,0,0.4);
    }

    .gold-top::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #D4A017, transparent);
    }

    .upload-zone {
      background: radial-gradient(ellipse at center, rgba(17,32,68,0.8) 0%, rgba(6,13,31,0.9) 100%);
      border: 2px dashed rgba(212,160,23,0.3);
      transition: all 0.3s ease;
      position: relative; overflow: hidden;
    }
    .upload-zone:hover { border-color: #D4A017; background: rgba(17,32,68,0.9); }
    
    .scan-line {
      background: linear-gradient(to bottom, transparent, rgba(212,160,23,0.8), transparent);
      height: 3px; box-shadow: 0 0 20px rgba(212,160,23,1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #D4A017 0%, #EFC24A 50%, #B8880F 100%);
      color: #060D1F; font-weight: 700;
      box-shadow: 0 4px 20px rgba(212,160,23,0.35); transition: all 0.2s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(212,160,23,0.5); }
    
    .btn-ghost { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #D1D9E6; transition: all 0.2s ease; }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .tab-btn {
      font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; transition: all 0.25s ease; padding-bottom: 12px;
    }
    .tab-active { color: #D4A017 !important; border-bottom-color: #D4A017 !important; font-weight: 700; }

    /* Photo Item Zoom Effect */
    .photo-item {
      border: 1px solid rgba(255,255,255,0.04); border-radius: 12px; overflow: hidden;
      aspect-ratio: 1; cursor: pointer; transition: all 0.3s ease;
      background: rgba(11,21,48,0.5);
    }
    .photo-item:hover {
      border-color: rgba(212,160,23,0.5); transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 10;
    }
    .photo-item img {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;
    }
    .photo-item:hover img { transform: scale(1.1); }

    /* Timeline Rail */
    .timeline-rail::before {
      content: ''; position: absolute; top: 0; bottom: 0; left: 20px; width: 2px;
      background: linear-gradient(to bottom, rgba(212,160,23,0.6) 0%, rgba(212,160,23,0.1) 80%, transparent 100%);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(212,160,23,0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212,160,23,0.5); }
  </style>

  <script>
    function previewImage(inputEl) {
      try {
        const file = inputEl && inputEl.files && inputEl.files[0];
        const preview = document.getElementById("preview");
        const placeholder = document.getElementById("uploadPlaceholder");
        const scanLine = document.getElementById("scanLine");
        if (!file) {
          preview.classList.add("hidden");
          placeholder.classList.remove("hidden");
          scanLine.classList.add("hidden");
          return;
        }
        preview.src = URL.createObjectURL(file);
        preview.classList.remove("hidden");
        placeholder.classList.add("hidden");
        scanLine.classList.remove("hidden");
      } catch (e) { console.error(e); }
    }
    function setImgSrc(imgEl, url) { if(imgEl) { imgEl.referrerPolicy = "no-referrer"; imgEl.src = url; } }
  </script>
</head>

<!-- ══ ALL JS LOGIC ══ -->
<script>
(() => {
  // API Config (Replace with real AWS credentials if needed)
  const API_ID = "vxid0yoovj";
  const REGION = "ap-south-1";
  const BASE_URL = `https://${API_ID}.execute-api.${REGION}.amazonaws.com/prod`;

  // State
  let globalTimeline = [];
  let globalPhotos = []; // {url, eventObj, index}
  let currentFilter = 'all';

  const el = {
    leftCol: document.getElementById("leftCol"),
    rightCol: document.getElementById("rightCol"),
    selfieInput: document.getElementById("selfieInput"),
    uploadInput: document.getElementById("uploadInput"),
    searchBtn: document.getElementById("searchBtn"),
    statusBox: document.getElementById("statusBox"),
    
    // Stats Header
    scoreVal: document.getElementById("scoreVal"),
    photoCountVal: document.getElementById("photoCountVal"),
    eventCountVal: document.getElementById("eventCountVal"),
    nameInput: document.getElementById("nameInput"),
    mobileInput: document.getElementById("mobileInput"),

    // Tabs & Views
    btnTabPhotos: document.getElementById("btnTabPhotos"),
    btnTabTimeline: document.getElementById("btnTabTimeline"),
    viewPhotos: document.getElementById("viewPhotos"),
    viewTimeline: document.getElementById("viewTimeline"),
    photosGrid: document.getElementById("photosGrid"),
  };

  // ── Tabs Logic ──
  function switchTab(tab) {
    if (tab === 'timeline') {
      el.viewTimeline.classList.remove('hidden');
      el.viewPhotos.classList.add('hidden');
      el.btnTabTimeline.classList.add('tab-active');
      el.btnTabTimeline.classList.remove('text-slate-400');
      el.btnTabPhotos.classList.remove('tab-active');
      el.btnTabPhotos.classList.add('text-slate-400');
    } else {
      el.viewTimeline.classList.add('hidden');
      el.viewPhotos.classList.remove('hidden');
      el.btnTabPhotos.classList.add('tab-active');
      el.btnTabPhotos.classList.remove('text-slate-400');
      el.btnTabTimeline.classList.remove('tab-active');
      el.btnTabTimeline.classList.add('text-slate-400');
    }
  }
  el.btnTabTimeline.addEventListener('click', () => switchTab('timeline'));
  el.btnTabPhotos.addEventListener('click', () => switchTab('photos'));

  // ── Helpers ──
  function isNonEmpty(v) { return v !== null && v !== undefined && String(v).trim() !== ""; }
  function escapeHtml(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function prettyIso(iso) {
    if (!iso) return "";
    const date = new Date(iso);
    return isNaN(date) ? iso : date.toLocaleDateString('hi-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function getEventFormDate(formType, data) {
    if (!data) return "";
    const pick = (...keys) => { for (const k of keys) { if (data[k]) return data[k]; } return ""; };
    if (formType === "president_tour_form") return pick("tour_date","दिनांक","date","program_date");
    if (formType === "mandal_reporting" || formType === "mandal_reporting_form") return pick("report_date","event_date","दिनांक","date");
    if (formType === "party_attendance") return pick("attendance_date","event_date","दिनांक");
    return pick("event_date","program_date","दिनांक","date");
  }

  function getEventPhotos(item) {
    if (Array.isArray(item.photos) && item.photos.length) return item.photos;
    if (Array.isArray(item.photo_urls) && item.photo_urls.length) return item.photo_urls;
    return [];
  }

  // ── PPT Slideshow Controller ──
  const PPT = (() => {
    let currentIdx = 0;
    const overlay = document.getElementById("pptOverlay");
    const img = document.getElementById("pptImg");
    const title = document.getElementById("pptTitle");
    const dateTxt = document.getElementById("pptDate");
    const locTxt = document.getElementById("pptLocation");
    const typeBadge = document.getElementById("pptTypeTxt");
    const list = document.getElementById("pptDetailsList");
    const counter = document.getElementById("pptCounter");

    // Zoom Logic
    let scale = 1;
    img.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += e.deltaY * -0.005;
      scale = Math.min(Math.max(1, scale), 4); // limits 1x to 4x
      img.style.transform = `scale(${scale})`;
    });

    function resetZoom() { scale = 1; img.style.transform = `scale(1)`; }

    function open(idx) {
      if (!globalPhotos.length) return;
      currentIdx = idx;
      updateView();
      overlay.classList.remove("hidden");
      // Small delay for animation
      setTimeout(() => overlay.classList.remove("opacity-0"), 10);
      document.body.style.overflow = "hidden";
    }

    function close() {
      overlay.classList.add("opacity-0");
      resetZoom();
      setTimeout(() => {
        overlay.classList.add("hidden");
        document.body.style.overflow = "auto";
      }, 300);
    }

    function goTo(dir) {
      currentIdx = (currentIdx + dir + globalPhotos.length) % globalPhotos.length;
      updateView();
    }

    function updateView() {
      resetZoom();
      const p = globalPhotos[currentIdx];
      img.src = p.url;
      counter.textContent = `${currentIdx + 1} / ${globalPhotos.length}`;

      const item = p.eventObj || {};
      const data = item.data || {};
      const form = item.form_type || item.ft || "इवेंट";
      
      const formDate = getEventFormDate(form, data);
      const displayDate = formDate || prettyIso(item.created_at_iso || "");
      
      const pName = data.program_name || data["कार्यक्रम_का_नाम"] || data.tour_title || "";
      const venue = data.tour_location || data.venue || data["स्थान"] || "";
      const district = item.district || data.district || "";
      const locStr = [district, item.vidhansabha, venue].filter(Boolean).join(", ");

      title.textContent = pName || form.replace(/_/g, ' ');
      dateTxt.textContent = displayDate || "तारीख उपलब्ध नहीं";
      locTxt.textContent = locStr || "स्थान उपलब्ध नहीं";
      typeBadge.textContent = form.replace(/_/g, ' ');

      // Build List
      list.innerHTML = "";
      const addRow = (k, v) => {
        if (!v) return;
        list.innerHTML += `
          <div class="flex flex-col pb-3 border-b border-gold-500/10 last:border-0">
            <span class="text-[10px] text-slate-500 uppercase tracking-wider font-bold mb-1">${k}</span>
            <span class="text-sm text-white break-words leading-snug">${escapeHtml(v)}</span>
          </div>
        `;
      };
      
      addRow("जिला / मंडल", [item.district, item.mandal].filter(Boolean).join(" - "));
      addRow("उपस्थिति", data.total_attendance || data.attendance_count);
      addRow("वक्ता / अतिथि", data.other_speakers || data.guests);
      if(item.with_label) addRow("किसके साथ", item.with_label);
      addRow("विवरण", data.program_details || data.report_summary);
    }

    document.getElementById("pptClose").addEventListener("click", close);
    document.getElementById("pptPrev").addEventListener("click", () => goTo(-1));
    document.getElementById("pptNext").addEventListener("click", () => goTo(1));
    document.addEventListener("keydown", (e) => {
      if (overlay.classList.contains("hidden")) return;
      if (e.key === "ArrowLeft") goTo(-1);
      if (e.key === "ArrowRight") goTo(1);
      if (e.key === "Escape") close();
    });

    return { open };
  })();


  // ── Render Renderers ──
  function renderAll(timelineArr, rawPhotos) {
    globalTimeline = timelineArr || [];
    globalPhotos = [];
    el.photosGrid.innerHTML = "";
    el.viewTimeline.innerHTML = "";

    // Map photo URLs to Event objects for PPT view
    const photoToEvent = new Map();
    globalTimeline.forEach(item => {
      const ps = getEventPhotos(item);
      ps.forEach(url => photoToEvent.set(url, item));
    });

    // Handle raw photos array or extract from timeline if missing
    let finalPhotos = Array.isArray(rawPhotos) && rawPhotos.length > 0 ? rawPhotos : Array.from(photoToEvent.keys());

    // 1. Render Photo Grid
    if (finalPhotos.length === 0) {
      el.photosGrid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">कोई फोटो नहीं मिली</div>`;
    } else {
      finalPhotos.forEach((url, idx) => {
        const ev = photoToEvent.get(url) || {};
        globalPhotos.push({ url, eventObj: ev, index: idx });

        const div = document.createElement("div");
        div.className = "photo-item group relative";
        div.innerHTML = `<img src="${url}" loading="lazy" alt="Event" />
                         <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2 md:p-3">
                           <span class="text-white text-[10px] md:text-xs font-semibold truncate"><i class="fa-solid fa-expand mr-1 text-gold-400"></i> ज़ूम करें</span>
                         </div>`;
        div.addEventListener("click", () => PPT.open(idx));
        el.photosGrid.appendChild(div);
      });
    }

    // 2. Render Timeline (कब कहाँ आये)
    if (globalTimeline.length === 0) {
      el.viewTimeline.innerHTML = `<div class="text-center py-10 text-slate-500">कोई टाइमलाइन रिकॉर्ड नहीं</div>`;
    } else {
      globalTimeline.forEach((item, index) => {
        const data = item.data || {};
        const form = item.form_type || item.ft || "Event";
        const formDate = getEventFormDate(form, data);
        const displayDate = formDate || prettyIso(item.created_at_iso || "");
        
        let title = data.program_name || data["कार्यक्रम_का_नाम"] || form.replace(/_/g, ' ');
        const loc = [item.district, item.vidhansabha, data.venue || data.tour_location].filter(Boolean).join(", ");
        
        const ps = getEventPhotos(item);

        const wrp = document.createElement("div");
        wrp.className = "relative pl-4";
        wrp.innerHTML = `
          <div class="absolute w-3 h-3 rounded-full bg-gold-500 border-2 border-navy-950 z-10" style="left: -33px; top: 24px;"></div>
          <div class="bg-navy-900/60 border border-gold-500/10 rounded-xl p-4 md:p-5 hover:border-gold-500/40 hover:bg-navy-900 transition-all cursor-pointer group">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
              <h3 class="font-bold text-white text-base leading-snug group-hover:text-gold-400 transition-colors">${escapeHtml(title)}</h3>
              <span class="bg-gold-500/10 text-gold-400 border border-gold-500/20 px-2 py-1 rounded text-[10px] font-bold whitespace-nowrap"><i class="fa-regular fa-clock mr-1"></i>${escapeHtml(displayDate)}</span>
            </div>
            ${loc ? `<div class="text-xs text-slate-400 mb-3"><i class="fa-solid fa-location-dot text-gold-500/50 mr-1.5"></i>${escapeHtml(loc)}</div>` : ''}
            
            ${ps.length > 0 ? `
              <div class="flex gap-2 overflow-x-auto pb-1 mt-3 border-t border-white/5 pt-3">
                ${ps.slice(0, 4).map(u => `<img src="${u}" class="w-12 h-12 rounded object-cover border border-white/10" />`).join('')}
                ${ps.length > 4 ? `<div class="w-12 h-12 rounded bg-navy-950 flex items-center justify-center text-xs text-gold-400 font-bold border border-white/10">+${ps.length-4}</div>` : ''}
              </div>
            ` : ''}
          </div>
        `;

        // Click on timeline opens PPT with the first photo of that event (if exists)
        wrp.addEventListener("click", () => {
          if (ps.length > 0) {
            const globalIdx = globalPhotos.findIndex(gp => gp.url === ps[0]);
            if (globalIdx !== -1) PPT.open(globalIdx);
          } else {
             // If no photo, we can simulate PPT open with placeholder or just alert
             alert("इस इवेंट में कोई फोटो संलग्न नहीं है।");
          }
        });
        el.viewTimeline.appendChild(wrp);
      });
    }
  }

  function setStatus(msg, isError=false) {
    if (!msg) { el.statusBox.classList.add("hidden"); return; }
    el.statusBox.classList.remove("hidden");
    el.statusBox.className = `mt-4 text-center text-sm font-medium px-4 py-2 rounded-lg ${isError ? 'bg-red-500/10 text-red-400 border border-red-500/30' : 'bg-gold-500/10 text-gold-400 border border-gold-500/30'}`;
    el.statusBox.innerHTML = msg;
  }

  // ── MOCK/API Search Logic ──
  async function doSearch() {
    const file = (el.selfieInput.files && el.selfieInput.files[0]) || (el.uploadInput.files && el.uploadInput.files[0]);
    if (!file) { setStatus("कृपया पहले सेल्फी या फोटो अपलोड करें", true); return; }

    el.searchBtn.disabled = true;
    el.searchBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> खोज रहे हैं...';
    setStatus('<i class="fa-solid fa-spinner fa-spin mr-2"></i> चेहरा और डेटाबेस स्कैन हो रहा है...');

    // Simulate API Call / Network Delay
    setTimeout(() => {
      el.searchBtn.disabled = false;
      el.searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> खोज शुरू करें';
      setStatus("");

      // Mock Response Data
      const mockRes = {
        similarity: "96",
        profile: { name: "राम कुमार", mobile: "9876543210" },
        photo_urls: [
           "https://images.unsplash.com/photo-1555848962-6e79363ec58f?w=400&h=400&fit=crop",
           "https://images.unsplash.com/photo-1541872526848-18e9526e0e64?w=400&h=400&fit=crop",
           "https://images.unsplash.com/photo-1528605248644-14dd04022da1?w=400&h=400&fit=crop",
           "https://images.unsplash.com/photo-1523580494863-6f3031224c94?w=400&h=400&fit=crop"
        ],
        timeline: [
          { district: "Bhopal", vidhansabha: "Govindpura", form_type: "president_tour_form", created_at_iso: "2024-01-15T10:00:00Z", data: { program_name: "युवा सम्मेलन", venue: "BHEL Dussehra Maidan", total_attendance: "5000" }, photos: ["https://images.unsplash.com/photo-1555848962-6e79363ec58f?w=400&h=400&fit=crop", "https://images.unsplash.com/photo-1541872526848-18e9526e0e64?w=400&h=400&fit=crop"] },
          { district: "Bhopal", form_type: "mandal_reporting", created_at_iso: "2023-12-05T14:30:00Z", data: { program_name: "मंडल बैठक", venue: "Kolar Office" }, photos: ["https://images.unsplash.com/photo-1528605248644-14dd04022da1?w=400&h=400&fit=crop"] }
        ]
      };

      // Real integration would use fetch() here instead of mockRes.

      // Transition Layout
      el.leftCol.className = "lg:col-span-4 max-w-none w-full transition-all duration-700 space-y-5";
      el.rightCol.classList.remove("hidden");
      setTimeout(() => el.rightCol.classList.remove("opacity-0"), 100);

      // Populate Top Profile Header
      el.scoreVal.textContent = mockRes.similarity + "%";
      el.eventCountVal.textContent = mockRes.timeline.length;
      el.photoCountVal.textContent = mockRes.photo_urls.length;
      
      if(mockRes.profile.name) el.nameInput.value = mockRes.profile.name;
      if(mockRes.profile.mobile) el.mobileInput.value = mockRes.profile.mobile;

      // Render Views
      renderAll(mockRes.timeline, mockRes.photo_urls);
      switchTab('photos'); // Default tab

      // Scroll to top on mobile
      if(window.innerWidth < 1024) {
         setTimeout(() => el.rightCol.scrollIntoView({behavior:'smooth'}), 300);
      }
    }, 1500);
  }

  el.searchBtn.addEventListener("click", doSearch);
})();
</script>
